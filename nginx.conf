# IPTV Admin Panel — Nginx Configuration
# Deploy: sudo cp nginx.conf /etc/nginx/sites-available/iptv
#         sudo ln -sf /etc/nginx/sites-available/iptv /etc/nginx/sites-enabled/iptv
#         sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name nivatv.int.yt www.nivatv.int.yt;  # Replace with your domain if you have one

    # ── Frontend (Next.js on port 3000) ──────────────────────────────────
    # This catch-all proxy is CRITICAL — without it, direct URL navigation
    # (e.g. /logs, /users) returns 404 because nginx doesn't know about Next.js routes.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for Next.js hot reload / WebSocket in dev
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass real client IP and host through
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts for long-running SSR requests
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Backend API (Express on port 5000) ───────────────────────────────
    # Direct /api/* traffic to the backend so the frontend doesn't have to
    # proxy through Next.js rewrites (faster, no double-hop in production).
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Backend WebSocket (/ws) ───────────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # Keep WS connections alive
        proxy_send_timeout 3600s;
    }

    # ── Static logos served directly from disk (faster than proxying) ────
    location /logos/ {
        alias /home/ubuntu/iptv/backend/public/logos/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        access_log off;
    }

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
