# IPTV Admin Panel — Nginx Configuration
# Deploy: sudo cp nginx.conf /etc/nginx/sites-available/iptv
#         sudo ln -sf /etc/nginx/sites-available/iptv /etc/nginx/sites-enabled/iptv
#         sudo nginx -t && sudo systemctl reload nginx

server {
    server_name nivatv.abrdns.com www.nivatv.abrdns.com 44.206.18.189 nivatv.luxomall.in;
    client_max_body_size 500M;

    # ── Frontend (Next.js on port 3000) ──────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Backend API (Express on port 5000) ───────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Backend WebSocket (/ws) ──────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static logos served directly from disk ───────────────────────
    location /logos/ {
        alias /home/ubuntu/iptv/backend/public/logos/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        access_log off;
    }

    # ── Security headers (L-01 HSTS remediation) ─────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nivatv.luxomall.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nivatv.luxomall.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name luxomall.pdf-cropper.site payment.catsnamegenerator.site;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/payment.catsnamegenerator.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payment.catsnamegenerator.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80 default_server;
    server_name nivatv.luxomall.in nivatv.abrdns.com www.nivatv.abrdns.com payment.catsnamegenerator.site luxomall.pdf-cropper.site _;
    return 301 https://$host$request_uri;
}
