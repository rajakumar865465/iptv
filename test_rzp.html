<!DOCTYPE html>
<html>
<head>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <script>
        const options = {
            key: 'rzp_test_invalid123',
            amount: 6900,
            currency: 'INR',
            order_id: 'order_invalid456',
            name: 'Test',
            handler: function() {}
        };
        setTimeout(() => {
            try {
                const rzp = new Razorpay(options);
                rzp.open();
                console.log('Opened');
            } catch(e) {
                console.error('Error:', e);
            }
        }, 1000);
    </script>
</body>
</html>
